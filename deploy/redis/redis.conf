bind 127.0.0.1
protected-mode yes
port 6379
appendonly yes
appendfsync always
no-appendfsync-on-rewrite no
aof-use-rdb-preamble yes
save 900 1
save 300 10
save 60 10000
maxmemory-policy noeviction
stop-writes-on-bgsave-error yes
dir /var/lib/gameplan-redis
logfile /var/log/gameplan-redis.log
daemonize no
