<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>选人助手 · GAMEPLAN</title><link rel="icon" href="/static/monitor.ico"><link rel="stylesheet" href="/static/monitor.css"><link rel="stylesheet" href="/static/picture.css"><link rel="stylesheet" href="/static/bp.css"><script src="/static/bp.js" defer></script></head>
<body><header class="masthead"><div class="identity"><h1>选人助手</h1></div><div class="header-actions"><span id="status" role="status">等待画面</span><button id="enter-monitor" disabled title="确认阵容后进入对局监控">进入对局监控</button></div></header>
<main><section class="controls panel"><div class="control-row"><label>投屏显示器<select id="screen"></select></label><button id="start">开始监控</button><button id="stop" disabled>暂停</button><label class="file-button">选择选人截图<input id="file" type="file" accept="image/png,image/jpeg,image/webp" hidden></label><button id="reset">新一局</button></div></section>
<div class="workspace"><div class="visual-column"><section class="panel preview-panel"><div class="panel-title"><h2>当前选人画面</h2><span id="phase">待确认</span></div><div class="preview"><img id="preview" alt="当前选人画面" hidden></div><p id="note" class="muted">尚无识别结果</p></section>
<section class="panel"><div class="coach-body"><label>己方位于<select id="side"><option value="">待确认</option><option value="left">画面左侧</option><option value="right">画面右侧</option></select></label><label>左侧已选<textarea id="left" rows="2"></textarea></label><label>右侧已选<textarea id="right" rows="2"></textarea></label><label>禁用英雄<textarea id="banned" rows="2"></textarea></label><label class="check"><input id="confirmed" type="checkbox">已核对双方与禁用名单</label></div></section></div>
<aside class="advice-column"><section class="panel"><div class="coach-body"><h2>选人机制参考</h2><label>我的分路<select id="lane"><option value="">待确认</option><option>对抗路</option><option>中路</option><option>发育路</option><option>打野</option><option>辅助</option></select></label><label>本局可用英雄<textarea id="available" rows="3"></textarea></label><label>我的已锁定英雄<select id="locked"><option value="">尚未锁定</option></select></label><p id="message" role="status">确认阵容和可用英雄后显示参考</p><div id="results"></div><p id="boundary" class="muted">本地机制草案 · 未核验当前版本 · 不代表同路克制</p><p id="handoff-note" class="muted">核对阵容、己方位置和分路后，可进入对局监控。</p></div></section></aside></div></main></body></html>
